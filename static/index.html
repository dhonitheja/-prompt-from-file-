<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt from File</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:680px;margin:2rem auto;padding:0 1rem;color:#1a1a1a}
  #drop{border:2px dashed #999;border-radius:12px;padding:2.5rem 1rem;text-align:center;cursor:pointer}
  #drop.over{background:#eef4ff;border-color:#3b6fe0}
  .or{text-align:center;color:#777;margin:.8rem 0}
  #preview,#vpreview,#apreview{max-width:100%;max-height:260px;margin-top:1rem;border-radius:8px;display:none}
  input[type=text],select{width:100%;padding:.6rem;box-sizing:border-box}
  #note,#provider{margin-top:1rem}
  button{margin-top:1rem;padding:.7rem 1.2rem;border:0;border-radius:8px;background:#3b6fe0;color:#fff;font-size:1rem;cursor:pointer}
  button:disabled{opacity:.5}
  #out{white-space:pre-wrap;background:#f6f6f6;border-radius:8px;padding:1rem;margin-top:1rem;display:none}
  #err{color:#b00020;margin-top:1rem}
  #used,#notes{color:#666;font-size:.9rem;margin-top:.5rem}
</style>
</head>
<body>
<h1>Prompt from File</h1>
<p>Upload an image, video, audio, PDF or text file, or paste a link to a website, app, game or video, and get the prompt behind it.</p>
<div id="drop">Drop a file here or click to choose</div>
<input id="file" type="file" hidden accept="image/*,video/*,audio/*,application/pdf,text/*,.md,.csv,.json,.py,.js,.ts,.mp3,.wav,.m4a,.flac,.ogg">
<img id="preview" alt="Preview"><video id="vpreview" controls></video><audio id="apreview" controls></audio>
<div class="or">or</div>
<input id="url" type="text" placeholder="Paste a link (website, app store page, game, video, image...)">
<input id="note" type="text" placeholder="Optional: extra context (e.g. 'for Midjourney')">
<select id="provider">
  <option value="">Auto: local model, then ChatGPT, then Claude</option>
  <option value="ollama">Local model only (Ollama)</option>
  <option value="openai">ChatGPT only</option>
  <option value="claude">Claude only</option>
</select>
<button id="go" disabled>Generate prompt</button>
<div id="err"></div>
<div id="used"></div>
<div id="notes"></div>
<div id="out"></div>
<button id="copy" style="display:none;background:#444">Copy</button>
<script>
const $=id=>document.getElementById(id);
let file=null;
const names={openai:'ChatGPT',claude:'Claude',ollama:'local model'};
function refresh(){ $('go').disabled=!(file||$('url').value.trim()); }
function hidePreviews(){ for(const id of ['preview','vpreview','apreview']) $(id).style.display='none'; }
function setFile(f){
  file=f; $('url').value=''; $('drop').textContent=f.name; hidePreviews();
  const u=URL.createObjectURL(f);
  const el=f.type.startsWith('image/')?'preview':f.type.startsWith('video/')?'vpreview':f.type.startsWith('audio/')?'apreview':null;
  if(el){$(el).src=u;$(el).style.display='block'}
  refresh();
}
$('url').oninput=()=>{ if($('url').value.trim()){ file=null; $('drop').textContent='Drop a file here or click to choose'; hidePreviews(); } refresh(); };
$('drop').onclick=()=>$('file').click();
$('file').onchange=e=>e.target.files[0]&&setFile(e.target.files[0]);
$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('over')};
$('drop').ondragleave=()=>$('drop').classList.remove('over');
$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('over');e.dataTransfer.files[0]&&setFile(e.dataTransfer.files[0])};
$('go').onclick=async()=>{
  $('err').textContent='';$('used').textContent='';$('notes').textContent='';
  $('out').style.display='none';$('copy').style.display='none';
  $('go').disabled=true;$('go').textContent='Analyzing…';
  const fd=new FormData();
  if(file) fd.append('file',file); else fd.append('url',$('url').value.trim());
  fd.append('note',$('note').value);fd.append('provider',$('provider').value);
  try{
    const r=await fetch('/api/prompt',{method:'POST',body:fd});
    const j=await r.json();
    if(!r.ok)throw new Error(j.detail||'Request failed');
    $('used').textContent='Answered by: '+(names[j.provider]||j.provider);
    $('notes').textContent=(j.notes||[]).join(' ');
    $('out').textContent=j.prompt;$('out').style.display='block';$('copy').style.display='inline-block';
  }catch(e){$('err').textContent=e.message}
  $('go').textContent='Generate prompt';refresh();
};
$('copy').onclick=()=>navigator.clipboard.writeText($('out').textContent);
</script>
</body>
</html>
